const letters=['A','B','C','D'];
let shuffledBank=[], examNo=1, currentExam=[], idx=0, score=0, answered=false, chapterStats={};
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function prepareBank(){shuffledBank=shuffle([...QB]);}
function startExam(number){examNo=number;idx=0;score=0;answered=false;chapterStats={1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0}}; const start=(number-1)*50; currentExam=shuffledBank.slice(start,start+50); if(currentExam.length<50){prepareBank();examNo=1;currentExam=shuffledBank.slice(0,50)}; document.getElementById('summary').classList.remove('show');document.getElementById('quizCard').style.display='block';render();}
function russianExplanation(q){const answer=q.o[q.a];return `${q.e} Правильный вариант — «${answer}». В этом вопросе важно не просто запомнить термин, а увидеть ключевой признак концепции: именно он отличает правильный ответ от похожих, но относящихся к другой теме вариантов. На экзамене сначала ищи это определяющее различие, а уже потом выбирай ответ.`;}
function englishExplanation(q){const answer=q.o[q.a];return `The correct answer is “${answer}.” This option matches the defining feature of the concept tested in the question. The distractors either describe a neighboring concept, reverse the relationship, or add a condition that does not belong to the definition. On the exam, focus on the key distinguishing feature before choosing an answer.`;}
function render(){const q=currentExam[idx];answered=false; document.getElementById('examLabel').textContent=`Exam ${examNo}`;document.getElementById('countLabel').textContent=`Question ${idx+1}/50`;document.getElementById('scoreLabel').textContent=`Correct: ${score}`;document.getElementById('progress').style.width=`${idx/50*100}%`;document.getElementById('chapterPill').textContent=`Chapter ${q.ch}`;const dp=document.getElementById('difficultyPill');dp.textContent=q.d==='easy'?'Easy':q.d==='medium'?'Medium':'Hard';dp.className=`pill ${q.d}`;document.getElementById('question').textContent=q.q;const box=document.getElementById('answers');box.innerHTML=''; q.o.forEach((txt,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${letters[i]}</span><span>${txt}</span>`;b.onclick=()=>choose(i,b);box.appendChild(b)});const fb=document.getElementById('feedback');fb.className='feedback';document.getElementById('feedbackTitle').textContent='';document.getElementById('feedbackRu').textContent='';document.getElementById('feedbackEn').textContent='';document.getElementById('nextBtn').disabled=true;document.getElementById('nextBtn').textContent=idx===49?'Finish exam':'Next question';}
function choose(choice,btn){if(answered)return;answered=true;const q=currentExam[idx];chapterStats[q.ch].t++;const buttons=[...document.querySelectorAll('.answer')];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct')});const fb=document.getElementById('feedback');if(choice===q.a){score++;chapterStats[q.ch].c++;btn.classList.add('correct');fb.className='feedback show ok';document.getElementById('feedbackTitle').textContent='Correct ✓';}else{btn.classList.add('wrong');fb.className='feedback show bad';document.getElementById('feedbackTitle').textContent='Incorrect ✕';}document.getElementById('feedbackRu').textContent=russianExplanation(q);document.getElementById('feedbackEn').textContent=englishExplanation(q);document.getElementById('scoreLabel').textContent=`Correct: ${score}`;document.getElementById('nextBtn').disabled=false;}
function next(){if(!answered)return;if(idx<49){idx++;render()}else{finish()}}
function finish(){document.getElementById('progress').style.width='100%';document.getElementById('quizCard').style.display='none';const s=document.getElementById('summary');s.classList.add('show');document.getElementById('summaryTitle').textContent=`Exam ${examNo} завершён`;document.getElementById('finalScore').textContent=`${score}/50`;const pct=Math.round(score/50*100);document.getElementById('summaryText').textContent=pct>=90?'Excellent result. You can move to the next set.':pct>=75?'Good result. Review your mistakes before the next exam.':pct>=60?'You have the basics, but review weaker chapters and try another set.':'Review the notes and take the next exam more slowly.';const grid=document.getElementById('chapterGrid');grid.innerHTML='';for(let c=1;c<=4;c++){const x=chapterStats[c];const p=x.t?Math.round(x.c/x.t*100):0;grid.innerHTML+=`<div class="mini"><b>${x.c}/${x.t}</b><span>Chapter ${c} · ${p}%</span></div>`}const n=document.getElementById('nextExamBtn');if(examNo===1){n.style.display='inline-block';n.textContent='Start Exam 2'}else{n.style.display='none'}}
document.getElementById('nextBtn').onclick=next;document.getElementById('nextExamBtn').onclick=()=>startExam(2);document.getElementById('restartBtn').onclick=()=>{prepareBank();startExam(1)};
document.addEventListener('keydown',e=>{if(!answered&&['1','2','3','4'].includes(e.key)){const i=Number(e.key)-1;document.querySelectorAll('.answer')[i]?.click()}else if(answered&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next()}});
prepareBank();startExam(1);
</script>
